# Unit test di Windows dan Linux. Paket berat (torch, Whisper, MeloTTS, audio, GUI) tidak
# dipasang: tests/conftest.py men-stub-nya, jadi yang dites logika aplikasi, bukan model.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Pasang paket untuk test
        run: python -m pip install pytest numpy scipy pillow pyyaml psutil
      - name: pytest
        run: python -m pytest -q
