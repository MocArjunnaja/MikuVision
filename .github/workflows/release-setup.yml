# Aset rilis untuk MikuVision Setup (docs/PLAN_INSTALLER.md bagian 7): MikuVisionSetup.exe, zip kode,
# version.json, dan SHA256SUMS. Wizard membaca ketiganya dari releases/latest/download/, tanpa GitHub API.
# Dipicu tag vX.Y.Z; bisa dijalankan ulang untuk tag yang sudah ada lewat "Run workflow".
name: release-setup

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag yang sudah ada, misalnya v1.6.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Versi dari tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG bukan vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Bangun MikuVisionSetup.exe
        run: |
          python -m pip install -r requirements-setup.txt
          python -m PyInstaller --noconfirm miku_setup.spec
      - name: Zip kode, version.json, dan SHA256SUMS
        run: |
          mkdir -p release
          cp dist/MikuVisionSetup.exe release/
          git archive --format=zip --prefix="MikuVision-$VERSION/" -o "release/MikuVision-$VERSION.zip" "$TAG"
          python -c "import json, sys, datetime; json.dump({'version': sys.argv[1], 'date': datetime.date.today().isoformat(), 'notes_url': sys.argv[2]}, open('release/version.json', 'w'))" \
            "$VERSION" "https://github.com/${{ github.repository }}/releases/tag/$TAG"
          cd release
          sha256sum "MikuVision-$VERSION.zip" MikuVisionSetup.exe > SHA256SUMS
          cat SHA256SUMS version.json
          ls -la
      - name: Lampirkan ke rilis
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "MikuVision $VERSION" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
